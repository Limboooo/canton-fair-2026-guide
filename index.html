const $=id=>document.getElementById(id),COL={A:'#248777',B:'#367da8',C:'#9270a4',D:'#bd7479'},PN={ALL:'全部',I:'第一期',II:'第二期',III:'第三期',J:'锦汉展'},DT={ALL:'各期目标',I:'10.15–19',II:'10.23–27',III:'10.31–11.04',J:'10.21–27'};
let view='find',phase='ALL',area='ALL',q='',filterOpen=false,target=null,chosen=null,zoomed=false,saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('cf2026-saved')||'[]'))}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
function rows(){return DATA.records.filter(r=>(phase==='ALL'?r.phase!=='J':r.phase===phase)&&(view!=='saved'||saved.has(r.id))&&(area==='ALL'||r.halls.some(h=>h.area===area))&&q.split(/\s+/).filter(Boolean).every(t=>norm([r.name,r.short,r.product,r.alias,r.contact,r.phone,r.navigation_booth,r.booth,...r.halls.map(h=>h.area+'区 '+h.hall+' '+h.booth)].join(' ')).includes(norm(t))))}
function card(r){return `<article class="card" style="--area:${COL[r.halls[0]?.area]||'#73818a'}"><div class="meta"><i class="dot"></i>${PN[r.phase]}<span>·</span>${DT[r.phase]}</div><button class="star ${saved.has(r.id)?'on':''}" data-save="${r.id}" aria-label="${saved.has(r.id)?'取消重点':'加入重点'} ${esc(r.short)}" aria-pressed="${saved.has(r.id)}">${saved.has(r.id)?'★':'☆'}</button><h3>${esc(r.short)}</h3><p class="product">${esc(r.product)}</p>${r.halls.length?r.halls.map((h,i)=>`<div class="placement"><div><div class="where" style="--area:${COL[h.area]}">${h.area} 区 · ${esc(h.hall.split('.')[1])} 楼</div><div class="hall">${esc(h.hall)}<small>馆</small></div><div class="booth">展位 ${esc(h.booth)}</div></div><button class="mapbtn" data-target="${r.id}" data-hall="${i}">地图定位 ↗</button></div>`).join(''):`<div class="placement"><div><div class="where">锦汉展 · 独立展场</div><div class="booth">${esc(r.booth)}</div></div></div>`}<details class="details"><summary>联系人与详细资料</summary><p>${esc(r.name)}</p><p>${esc(r.contact)}</p>${r.phone.split('/').filter(Boolean).map(p=>`<a href="tel:${p.replace(/[^\d+]/g,'')}">拨打 ${esc(p)}</a>`).join('')}${r.note?`<p>${esc(r.note)}</p>`:''}</details></article>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('heading').textContent=view==='map'?'展馆导览':view==='saved'?'重点参观':'供应商检索';$('subtitle').textContent=view==='map'?'按展期查看场馆分布及供应商位置。':view==='saved'?'收藏重点供应商，集中查看参观信息。':'查询供应商、展位及所在场馆。';$('searchSection').hidden=view==='map';$('phases').innerHTML=(view==='map'?['I','II','III']:['ALL','I','II','III','J']).map(p=>`<button data-phase="${p}" class="${p===phase?'active':''}" aria-pressed="${p===phase}">${PN[p]}<small>${DT[p]}</small></button>`).join('');if(view==='map'){mapRender();return}const rr=rows();$('content').innerHTML=`<div class="toolbar"><div><h2>${view==='saved'?'我的重点':q?'搜索结果':'参观目标'}<span>${rr.length} 项</span></h2></div><button class="filter" id="filterToggle" aria-expanded="${filterOpen}">${area==='ALL'?'按区域筛选':area+' 区'} ⌄</button></div><div id="filters" ${filterOpen?'':'hidden'}><select id="area" aria-label="区域筛选">${['ALL','A','B','C','D'].map(a=>`<option value="${a}" ${area===a?'selected':''}>${a==='ALL'?'全部区域':a+' 区'}</option>`).join('')}</select><button id="reset">重置筛选</button></div><div class="cards">${rr.length?rr.map(card).join(''):`<div class="empty"><h3>${view==='saved'?'暂无重点参观目标':'暂时没有匹配目标'}</h3><p>${view==='saved'?'点击供应商卡片上的 ☆，即可加入重点参观。<br>清单保存在当前设备。':'试试供应商简称、产品关键词或展位号。'}</p><button id="reset">查看全部目标 →</button></div>`}</div>`}
function mapRender(){const gg=DATA.geo[phase]||[], rr=DATA.records.filter(r=>r.phase===phase), active=new Set(rr.flatMap(r=>r.halls.map(h=>h.hall)));let box='0 0 800 600';if(chosen&&zoomed){const a=gg.find(g=>g.hall===chosen);if(a)box=`${Math.max(0,Math.min(440,a.center[0]-180))} ${Math.max(0,Math.min(330,a.center[1]-135))} 360 270`}const selected=chosen?rr.filter(r=>r.halls.some(h=>h.hall===chosen)):[];$('content').innerHTML=`${target?`<button class="back" id="back">← 返回目标列表</button><div class="target"><div><h3>${esc(target.r.short)}</h3><p>${target.h.area} 区 · ${target.h.hall.split('.')[1]} 楼 · 展位 ${esc(target.h.booth)}</p></div><strong>${esc(target.h.hall)} 馆</strong></div>`:''}<div class="mapwrap"><div class="maptitle"><strong>${PN[phase]} · ${chosen?chosen+' 馆':'全馆概览'}</strong><button id="zoom" ${chosen?'':'disabled'}>${zoomed?'全馆总览 ↗':'放大目标 ⊕'}</button></div><div class="mapstage"><svg style="min-width:${chosen&&zoomed?'100%':'560px'}" id="hallMap" role="img" aria-label="${PN[phase]}展馆地图" viewBox="${box}" xmlns="http://www.w3.org/2000/svg"><image href="${DATA.base}" width="800" height="600"/>${gg.map(g=>`<g tabindex="0" role="button" aria-label="${esc(g.hall)}馆" data-map-hall="${esc(g.hall)}"><polygon points="${g.poly.map(p=>p.join(',')).join(' ')}" fill="${COL[g.area]}" fill-opacity="${g.hall===chosen?1:active.has(g.hall)?.35:.1}" stroke="${g.hall===chosen?'#163343':COL[g.area]}" stroke-width="${g.hall===chosen?2.5:.5}"/><text x="${g.center[0]}" y="${g.center[1]+3}" text-anchor="middle" font-size="9" font-weight="${g.hall===chosen?700:400}" fill="${g.hall===chosen?'white':'#324b5b'}" pointer-events="none">${esc(g.hall)}</text></g>`).join('')}</svg></div><div class="legend">${Object.entries(COL).map(([a,c])=>`<span><b style="background:${c}"></b>${a} 区</span>`).join('')}</div><div class="mapfoot">深色区域为目标展馆 · 地图可左右滑动查看<br>位置依据交接包场馆底图，不提供馆内实时导航。</div></div><div class="toolbar"><h2>${chosen?chosen+' 馆的目标':'选择馆号，查看供应商'}<span>${chosen?selected.length+' 项':''}</span></h2>${chosen?'<button id="overview" class="filter">清除选择</button>':''}</div><div class="cards">${selected.length?selected.map(card).join(''):chosen?'<div class="empty"><p>该馆暂无收录的供应商</p></div>':''}</div>`}
function toast(s){$('toast').textContent=s;setTimeout(()=>$('toast').textContent='',2200)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-map-hall]');if(!b)return;if(b.dataset.view){view=b.dataset.view;target=null;chosen=null;zoomed=false;area='ALL';if(view==='map'&&!['I','II','III'].includes(phase))phase='I';render();window.scrollTo(0,0)}else if(b.dataset.phase){phase=b.dataset.phase;target=null;chosen=null;zoomed=false;area='ALL';render()}else if(b.dataset.save){const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('cf2026-saved',JSON.stringify([...saved]));toast(saved.has(id)?'已加入重点参观':'已取消重点')}catch{toast('本次已保存，当前环境不支持长期保存')}render()}else if(b.dataset.target){const r=DATA.records.find(r=>r.id===b.dataset.target);target={r,h:r.halls[+b.dataset.hall]};phase=r.phase;chosen=target.h.hall;view='map';zoomed=true;render();window.scrollTo(0,0)}else if(b.dataset.mapHall){chosen=b.dataset.mapHall;target=null;mapRender()}else if(b.id==='filterToggle'){filterOpen=!filterOpen;render()}else if(b.id==='reset'){phase='ALL';area='ALL';q='';view='find';$('search').value='';render()}else if(b.id==='clear'){q='';$('search').value='';render();$('search').focus()}else if(b.id==='zoom'){zoomed=!zoomed;mapRender()}else if(b.id==='overview'){chosen=null;target=null;zoomed=false;mapRender()}else if(b.id==='back'){view='find';area='ALL';render()}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-map-hall]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});document.addEventListener('change',e=>{if(e.target.id==='area'){area=e.target.value;render()}});$('search').addEventListener('input',e=>{q=e.target.value;render()});render();
</script></body></html>
